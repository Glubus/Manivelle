name: CI
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MANIVELLE_REQUIRE_TSC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: rustup show
      - run: cargo fmt --all --check
      # Every feature but `disable-assertions`: tests run with QuickJS assertions on.
      - run: cargo clippy --workspace --features derive,uuid,chrono,glam,cli --all-targets --locked -- -D warnings
      - run: cargo test --workspace --features derive,uuid,chrono,glam,cli --locked
      - run: cargo test --workspace --no-default-features --locked
      - run: cargo check --workspace --all-features --all-targets --locked
      - run: cargo run --example getting_started --features derive --locked
      - run: cargo run --example game_loop --features derive --locked
      - run: cargo package -p manivelle_macros --locked
      - run: cargo package -p manivelle --locked
      - run: cargo package -p manivelle_bevy --locked
      - run: cargo doc --workspace --no-deps --features derive,uuid,chrono,glam,cli --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.52'
      - run: mdbook build
