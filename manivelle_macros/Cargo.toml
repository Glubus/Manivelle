[package]
name = "manivelle_macros"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
description = "Derive macros for Manivelle TypeScript schemas"
repository = "https://github.com/Glubus/Manivelle"
license = "MIT"
keywords = ["typescript", "derive", "scripting"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.46"
syn = { version = "2.0.118", features = ["full"] }
