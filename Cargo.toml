[package]
name = "manivelle"
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
description = "Embedded TypeScript runtime for Rust with typed host contracts and generated SDKs"
repository = "https://github.com/Glubus/Manivelle"
readme = "README.md"
license = "MIT"
keywords = ["typescript", "scripting", "quickjs", "embedded", "gamedev"]
categories = ["game-development", "development-tools", "api-bindings"]
exclude = [".github", ".cargo", "package.json", "package-lock.json", "book.toml"]

[package.metadata.docs.rs]
features = ["derive", "uuid", "chrono", "glam"]

[workspace]
members = [".", "manivelle_macros"]

[features]
default = []
derive = ["dep:manivelle_macros"]
uuid = ["dep:uuid"]
chrono = ["dep:chrono"]
glam = ["dep:glam"]
# The `manivelle` command line tool (`cargo install manivelle --features cli`).
cli = ["dep:clap"]
# Builds QuickJS without its internal assertions: JavaScript runs faster, but a JavaScript
# value the host leaks no longer aborts the process when the engine drops.
disable-assertions = ["rquickjs/disable-assertions"]

[dependencies]
oxc = { version = "0.137.0", features = ["codegen", "full", "transformer"] }
oxc_resolver = "11.21.3"
oxc_sourcemap = "8.1.2"
rquickjs = { version = "0.14.0", features = ["rust-alloc", "loader"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rustc-hash = "2.1.3"
thiserror = "2.0.17"
blake3 = "1.8.2"
indexmap = "2.14.2"
tempfile = "3.23.0"
manivelle_macros = { version = "0.1.2", path = "manivelle_macros", optional = true }
uuid = { version = "1.26.1", optional = true, default-features = false, features = ["serde"] }
chrono = { version = "0.4.45", optional = true, default-features = false, features = ["std", "serde"] }
glam = { version = "0.33.9", optional = true, features = ["serde"] }
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.8.2"
trybuild = "1.0.111"
mlua = { version = "0.12.1", features = ["lua54", "vendored", "serialize"] }

[[bin]]
name = "manivelle"
path = "src/bin/manivelle.rs"
required-features = ["cli"]

[[bench]]
name = "runtime"
harness = false
required-features = ["derive"]

[[bench]]
name = "native_bridge"
harness = false
required-features = ["derive"]

[[bench]]
name = "vs_lua"
harness = false

[[example]]
name = "getting_started"
required-features = ["derive"]

[[example]]
name = "game_loop"
required-features = ["derive"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3
